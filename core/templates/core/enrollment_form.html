{% extends 'core/base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><h5>Новая запись на занятие</h5></div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Ученик</label>
                        <select name="student_id" class="form-select" {% if user.role_name == 'Ученик' %}disabled{% endif %}>
                            {% for st in students %}<option value="{{ st.id }}">{{ st.full_name }} (группа №{{ st.group.number }})</option>{% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Занятие из расписания</label>
                        <select name="lesson_id" class="form-select" required>
                            {% for l in lessons %}<option value="{{ l.id }}" {% if preselected_lesson == l.id|stringformat:"s" %}selected{% endif %}>{{ l.lesson_date|date:"d.m.Y" }} {{ l.lesson_time|time:"H:i" }} — {{ l.type }} (гр. {{ l.group.number }}, {{ l.instructor.full_name }})</option>{% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Комментарий</label>
                        <textarea name="comment" class="form-control" rows="2" placeholder="Необязательно"></textarea>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-success">Сохранить</button>
                        <a href="{% url 'enrollment_list' %}" class="btn btn-secondary">Отмена</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
