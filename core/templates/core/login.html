{% extends 'core/base.html' %}
{% block title %}Вход — Автошкола «Драйв»{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white text-center"><h4 class="mb-0">Автошкола «Драйв»</h4></div>
            <div class="card-body p-4">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3"><label class="form-label">Логин</label><input type="text" name="username" class="form-control" required autofocus></div>
                    <div class="mb-3"><label class="form-label">Пароль</label><input type="password" name="password" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100">Войти</button>
                </form>
                <hr>
                <small class="text-muted">
                    <strong>Тестовые логины:</strong><br>
                    Админ: <code>admin</code> / <code>admin123</code><br>
                    Инструктор: <code>ivanov</code> / <code>ivanov123</code><br>
                    Ученик: <code>petrov</code> / <code>petrov123</code>
                </small>
            </div>
        </div>
    </div>
</div>
{% endblock %}
